<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pera AI Swipe</title><style>body{background:#101218;color:white;font:16px system-ui;margin:0;padding:20px;max-width:500px;margin:auto}h1{font-size:25px}#photo{height:55vh;background:#222631;border-radius:20px;display:grid;place-items:center;overflow:hidden;touch-action:none;transition:transform .15s}img{width:100%;height:100%;object-fit:contain;pointer-events:none}button,label{display:inline-block;background:#292e39;color:white;border:0;border-radius:12px;padding:14px;margin:5px 0;font:inherit}nav{display:flex;gap:8px}nav button{flex:1}small{color:#aab0bf}#no{background:#9c343e}#yes{background:#176b49}#maybe{background:#86621b}input{display:none}</style><h1>PERA / AI SWIPE <small>1.5</small></h1><button id="library">Vul trainingsbibliotheek (1.000)</button> <button id="stop" disabled>Pauzeer import</button> <select id="category"><option value="all">Gemengd</option><option value="Motorsport">Motorsport</option><option value="Moeilijk">Moeilijke gevallen</option><option value="Straatfotografie">Straatfotografie</option><option value="Landschappen">Landschappen</option><option value="Architectuur">Architectuur</option><option value="Dieren en natuur">Dieren en natuur</option><option value="Evenementen">Evenementen</option><option value="Portretten">Portretten</option><option value="own">Eigen foto’s</option></select><p id="status" role="status"></p><p id="stats"></p><div id="photo">Importeer testfoto’s</div><h2>Zou je deze posten?</h2><nav><button id="no">← Nee</button><button id="maybe">↑ Misschien</button><button id="yes">Ja →</button></nav><label>Foto’s toevoegen<input id="files" type="file" accept="image/*" multiple></label> <button id="undo">Herstellen</button> <button id="export">JSON exporteren</button><p><small>Eigen foto’s blijven in deze browser. Openbare foto’s worden via internet geladen. Houd de app open tijdens import. Beoordelingen zijn publicatievoorkeuren, geen gezichtslabels.</small></p><script>let db,items=[],current;const $=id=>document.getElementById(id);let req=indexedDB.open('pera-swipe',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id'});req.onsuccess=()=>{db=req.result;load()};req.onerror=()=>alert('Lokale opslag niet beschikbaar');function load(){let r=db.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>{items=r.result;render()}}const motors=["MotoGP","WorldSBK","Formule 1"];let url;function render(){let selected=items.filter(x=>($("category").value==="all"&&(x.vote||!["Motorsport","GT en endurance","Rally en overige autosport"].includes(x.category)))||($("category").value==="own"?!x.source:($("category").value==="Motorsport"?motors.includes(x.category):x.category===$("category").value)));let pending=selected.filter(x=>!x.vote);if($('category').value==='Motorsport'){let done=selected.filter(x=>x.vote);let weights={MotoGP:.7,WorldSBK:.2,'Formule 1':.1};pending.sort((a,b)=>((done.length+1)*weights[b.category]-done.filter(x=>x.category===b.category).length)-((done.length+1)*weights[a.category]-done.filter(x=>x.category===a.category).length));}current=pending[0];$('stats').textContent=selected.filter(x=>x.vote).length+' / '+selected.length+' beoordeeld · '+items.filter(x=>x.source&&groups.some(g=>g[0]===x.category)).length+' / 1000 bibliotheek';if(url)URL.revokeObjectURL(url);$('photo').replaceChildren();if(current){url=current.blob?URL.createObjectURL(current.blob):null;let im=new Image();im.src=url||current.image_url;im.onerror=()=>{let bad=current;if(bad){current=null;let t=db.transaction('photos','readwrite');t.objectStore('photos').delete(bad.id);t.oncomplete=load} $('status').textContent='Onbereikbare foto overgeslagen; vul later opnieuw aan.'};$('photo').append(im)}else $('photo').textContent=items.length?'Alles beoordeeld':'Importeer testfoto’s';for(let id of ['no','yes','maybe'])$(id).disabled=!current}function save(x){let t=db.transaction('photos','readwrite');t.objectStore('photos').put(x);t.oncomplete=load;t.onerror=()=>alert('Opslaan mislukt')}function vote(v){if(!current)return;let x=current;current=null;save({...x,vote:v,time:new Date().toISOString()})}for(let [id,v] of [['no','nee'],['yes','ja'],['maybe','misschien']])$(id).onclick=()=>vote(v);$('files').onchange=async e=>{if(!db)return;let files=[...e.target.files];let records=[];for(let f of files){let hash=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());let id=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');if(!items.some(x=>x.id===id)&&!records.some(x=>x.id===id))records.push({id,name:f.name,blob:f,vote:null})}let t=db.transaction('photos','readwrite');for(let x of records)t.objectStore('photos').put(x);t.oncomplete=load;t.onerror=()=>alert('Import mislukt');e.target.value=''};$('undo').onclick=()=>{let x=items.filter(x=>x.vote).sort((a,b)=>b.time.localeCompare(a.time))[0];if(x)save({...x,vote:null,time:null})};$('export').onclick=()=>{let b=new Blob([JSON.stringify(items.filter(x=>x.vote).map(({blob,...x})=>x),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pera-labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('category').onchange=render;
const groups=[['MotoGP',175,['MotoGP race motorcycle','MotoGP rider helmet','MotoGP paddock','MotoGP podium']],['WorldSBK',50,['WorldSBK race','Superbike World Championship motorcycle','World Superbike rider','World Superbike paddock']],['Formule 1',25,['Formula One Grand Prix race car','Formula 1 pit lane']],['Straatfotografie',150,['street photography','pedestrians street']],['Landschappen',100,['mountain landscape','coastal landscape']],['Architectuur',100,['architecture building exterior','modern architecture','historic buildings']],['Dieren en natuur',100,['wildlife photography','birds nature']],['Evenementen',100,['festival crowd','public event']],['Portretten',100,['portrait photography','portrait of people','outdoor portrait']],['Moeilijk',100,['crowd reflection','people motion blur','people at night']]];
const clean=s=>{let d=new DOMParser().parseFromString(s||'', 'text/html');return d.body.textContent.trim()};
async function api(q,cont){let p=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrnamespace:'6',gsrsearch:q+' filetype:bitmap',gsrlimit:'30',prop:'imageinfo',iiprop:'url|extmetadata|mime',iiurlwidth:'1000',...cont});let r=await fetch('https://commons.wikimedia.org/w/api.php?'+p);if(!r.ok)throw Error('Wikimedia HTTP '+r.status);let j=await r.json();if(j.error)throw Error(j.error.info);return j}
let paused=false;$('stop').onclick=()=>{paused=true;$('status').textContent='Import wordt gepauzeerd…'};
$('library').onclick=async()=>{if(!db)return;paused=false;let btn=$('library');btn.disabled=true;$('stop').disabled=false;$('files').disabled=true;let added=0;let seen=new Set(items.map(x=>x.id));let counts=Object.fromEntries(groups.map(([c])=>[c,items.filter(x=>x.source&&x.category===c).length]));try{for(let [cat,target,queries] of groups){for(let q of queries){let key='pera-v15-cursor:'+q;let state=JSON.parse(localStorage.getItem(key)||'{}');while(!paused&&counts[cat]<target&&!state.done){$('status').textContent=`Bibliotheek: ${Object.values(counts).reduce((a,b)=>a+b,0)}/1000 · ${cat}`;let j=await api(q,state.cont||{});let records=[];for(let p of Object.values(j.query?.pages||{})){if(counts[cat]+records.length>=target)break;let id='library:commons-'+p.pageid;if(seen.has(id))continue;let i=p.imageinfo?.[0],m=i?.extmetadata||{};let license=clean(m.LicenseShortName?.value);if(!i?.thumburl||!/^image\/(jpeg|png|webp)$/i.test(i.mime||'')||! /^(CC BY(?:-SA)? [234]\.0|CC0|Public domain)$/i.test(license))continue;records.push({id,name:p.title,vote:null,source:i.descriptionurl,license,license_url:m.LicenseUrl?.value||'',author:clean(m.Artist?.value),category:cat,image_url:i.thumburl,original_url:i.url});seen.add(id)}await new Promise((resolve,reject)=>{let t=db.transaction('photos','readwrite');for(let x of records)t.objectStore('photos').add(x);t.oncomplete=resolve;t.onerror=reject;t.onabort=reject});counts[cat]+=records.length;added+=records.length;state=j.continue?{cont:j.continue}:{done:true};localStorage.setItem(key,JSON.stringify(state));await new Promise(r=>setTimeout(r,650))}if(paused||counts[cat]>=target)break}if(paused)break}let total=Object.values(counts).reduce((a,b)=>a+b,0);$('status').textContent=`${total}/1000 bibliotheek · ${added} nieuw. `+(paused?'Gepauzeerd; druk opnieuw om verder te gaan.':total>=1000?'Bibliotheek gevuld.':'Bronnen uitgeput; nog niet alle categorieën gevuld.')}catch(e){$('status').textContent=`${added} toegevoegd. ${e.message||'Import onderbroken'}. Druk opnieuw om verder te gaan.`}finally{btn.disabled=false;$('stop').disabled=true;$('files').disabled=false;load()}};
let start;$('photo').onpointerdown=e=>{start=[e.clientX,e.clientY];$('photo').setPointerCapture(e.pointerId)};$('photo').onpointermove=e=>{if(start)$('photo').style.transform=`translate(${(e.clientX-start[0])*.4}px,${(e.clientY-start[1])*.4}px)`};$('photo').onpointerup=e=>{if(!start)return;let x=e.clientX-start[0],y=e.clientY-start[1];start=null;$('photo').style.transform='';if(Math.max(Math.abs(x),Math.abs(y))<65)return;if(Math.abs(x)>Math.abs(y))vote(x>0?'ja':'nee');else if(y<0)vote('misschien');else $('undo').click()};$('photo').onpointercancel=()=>{start=null;$('photo').style.transform=''}</script></html>
