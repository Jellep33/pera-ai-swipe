<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pera AI Swipe</title><style>body{background:#101218;color:white;font:16px system-ui;margin:0;padding:20px;max-width:500px;margin:auto}h1{font-size:25px}#photo{height:55vh;background:#222631;border-radius:20px;display:grid;place-items:center;overflow:hidden;touch-action:none;transition:transform .15s}img{width:100%;height:100%;object-fit:contain;pointer-events:none}button,label{display:inline-block;background:#292e39;color:white;border:0;border-radius:12px;padding:14px;margin:5px 0;font:inherit}nav{display:flex;gap:8px}nav button{flex:1}small{color:#aab0bf}#no{background:#9c343e}#yes{background:#176b49}#maybe{background:#86621b}input{display:none}</style><h1>PERA / AI SWIPE <small>1.2</small></h1><button id="library">Start training</button> <select id="category"><option value="all">Gemengd</option><option value="Motorsport">Motorsport</option><option value="Moeilijk">Moeilijke gevallen</option><option value="Straatfotografie">Straatfotografie</option><option value="Landschappen">Landschappen</option><option value="Architectuur">Architectuur</option><option value="Dieren en natuur">Dieren en natuur</option><option value="Evenementen">Evenementen</option><option value="Portretten">Portretten</option><option value="own">Eigen foto’s</option></select><p id="status" role="status"></p><p id="stats"></p><div id="photo">Importeer testfoto’s</div><h2>Zou je deze posten?</h2><nav><button id="no">← Nee</button><button id="maybe">↑ Misschien</button><button id="yes">Ja →</button></nav><label>Foto’s toevoegen<input id="files" type="file" accept="image/*" multiple></label> <button id="undo">Herstellen</button> <button id="export">JSON exporteren</button><p><small>Foto’s blijven in deze browser. Beoordelingen zijn publicatievoorkeuren, geen gezichtslabels.</small></p><script>let db,items=[],current;const $=id=>document.getElementById(id);let req=indexedDB.open('pera-swipe',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id'});req.onsuccess=()=>{db=req.result;load()};req.onerror=()=>alert('Lokale opslag niet beschikbaar');function load(){let r=db.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>{items=r.result;render()}}let url;function render(){let selected=items.filter(x=>$("category").value==="all"||($("category").value==="own"?!x.source:x.category===$("category").value));current=selected.find(x=>!x.vote);$('stats').textContent=selected.filter(x=>x.vote).length+' / '+selected.length+' beoordeeld';if(url)URL.revokeObjectURL(url);$('photo').replaceChildren();if(current){url=URL.createObjectURL(current.blob);let im=new Image();im.src=url;im.onerror=()=>{current=null;$("photo").textContent="Foto kan niet worden geopend";for(let id of ["no","yes","maybe"])$(id).disabled=true};$('photo').append(im)}else $('photo').textContent=items.length?'Alles beoordeeld':'Importeer testfoto’s';for(let id of ['no','yes','maybe'])$(id).disabled=!current}function save(x){let t=db.transaction('photos','readwrite');t.objectStore('photos').put(x);t.oncomplete=load;t.onerror=()=>alert('Opslaan mislukt')}function vote(v){if(!current)return;let x=current;current=null;save({...x,vote:v,time:new Date().toISOString()})}for(let [id,v] of [['no','nee'],['yes','ja'],['maybe','misschien']])$(id).onclick=()=>vote(v);$('files').onchange=async e=>{if(!db)return;let files=[...e.target.files];let records=[];for(let f of files){let hash=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());let id=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');if(!items.some(x=>x.id===id)&&!records.some(x=>x.id===id))records.push({id,name:f.name,blob:f,vote:null})}let t=db.transaction('photos','readwrite');for(let x of records)t.objectStore('photos').put(x);t.oncomplete=load;t.onerror=()=>alert('Import mislukt');e.target.value=''};$('undo').onclick=()=>{let x=items.filter(x=>x.vote).sort((a,b)=>b.time.localeCompare(a.time))[0];if(x)save({...x,vote:null,time:null})};$('export').onclick=()=>{let b=new Blob([JSON.stringify(items.filter(x=>x.vote).map(({blob,...x})=>x),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pera-labels.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('category').onchange=render;
const groups=[['Motorsport',250,['motorsport racing car','motorcycle racing','pit stop racing','racing driver','motorsport spectators']],['Straatfotografie',150,['street photography','pedestrians street']],['Landschappen',100,['mountain landscape','coastal landscape']],['Architectuur',100,['architecture building exterior']],['Dieren en natuur',100,['wildlife photography','birds nature']],['Evenementen',100,['festival crowd','public event']],['Portretten',100,['portrait photography']],['Moeilijk',100,['crowd reflection','people motion blur','people at night']]];
const clean=s=>{let d=new DOMParser().parseFromString(s||'', 'text/html');return d.body.textContent.trim()};
async function api(q,cont){let p=new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrnamespace:'6',gsrsearch:q+' filetype:bitmap',gsrlimit:'30',prop:'imageinfo',iiprop:'url|extmetadata|mime',iiurlwidth:'1000',...cont});let r=await fetch('https://commons.wikimedia.org/w/api.php?'+p);if(!r.ok)throw Error('Wikimedia HTTP '+r.status);let j=await r.json();if(j.error)throw Error(j.error.info);return j}
$('library').onclick=async()=>{if(!db)return;let btn=$('library');let choice=$('category').value;if(choice==='own'){ $('status').textContent='Kies Foto’s toevoegen voor eigen foto’s.';return}btn.disabled=true;$('files').disabled=true;let added=0,failed=0;try{let seen=new Set(items.map(x=>x.id));let eligible=groups.filter(g=>choice==='all'||g[0]===choice);if(choice==='all')eligible.sort((a,b)=>items.filter(x=>x.category===a[0]).length/a[1]-items.filter(x=>x.category===b[0]).length/b[1]);for(let [cat,target,queries] of eligible){let count=items.filter(x=>x.category===cat).length;if(count>=target)continue;for(let q of queries){let key='pera-commons-cursor:'+q;let state=JSON.parse(localStorage.getItem(key)||'{}');if(state.done)continue;let j=await api(q,state.cont||{});let pages=Object.values(j.query?.pages||{});let complete=true;for(let p of pages){if(added>=25||count>=target){complete=false;break}let id='library:commons-'+p.pageid;if(seen.has(id))continue;let i=p.imageinfo?.[0],m=i?.extmetadata||{};let license=clean(m.LicenseShortName?.value);let licenseUrl=m.LicenseUrl?.value||'';if(!i?.thumburl||!/^image\/(jpeg|png|webp)$/i.test(i.mime||'')||! /^(CC BY(?:-SA)? [234]\.0|CC0|Public domain)$/i.test(license))continue;$('status').textContent=`Foto’s laden: ${added}/25 · ${cat}`;try{let r=await fetch(i.thumburl);if(!r.ok)throw Error('HTTP '+r.status);let blob=await r.blob();if(!blob.type.startsWith('image/'))throw Error('Geen afbeelding');await new Promise((resolve,reject)=>{let t=db.transaction('photos','readwrite');t.objectStore('photos').put({id,name:p.title,blob,vote:null,source:i.descriptionurl,license,license_url:licenseUrl,author:clean(m.Artist?.value),category:cat,image_url:i.thumburl,original_url:i.url});t.oncomplete=resolve;t.onerror=reject;t.onabort=reject});seen.add(id);added++;count++}catch(e){failed++;if(failed>=5)throw Error('Meerdere downloads mislukt. Probeer later opnieuw.')}await new Promise(r=>setTimeout(r,350))}if(complete&&failed===0)localStorage.setItem(key,JSON.stringify(j.continue?{cont:j.continue}:{done:true}));if(added>=25||count>=target)break}if(added>=25)break}$('status').textContent=`${added} nieuwe foto’s · ${failed} mislukt. Druk opnieuw voor meer.`}catch(e){$('status').textContent=`${added} toegevoegd. ${e.message}`}finally{btn.disabled=false;$('files').disabled=false;load()}};
let start;$('photo').onpointerdown=e=>{start=[e.clientX,e.clientY];$('photo').setPointerCapture(e.pointerId)};$('photo').onpointermove=e=>{if(start)$('photo').style.transform=`translate(${(e.clientX-start[0])*.4}px,${(e.clientY-start[1])*.4}px)`};$('photo').onpointerup=e=>{if(!start)return;let x=e.clientX-start[0],y=e.clientY-start[1];start=null;$('photo').style.transform='';if(Math.max(Math.abs(x),Math.abs(y))<65)return;if(Math.abs(x)>Math.abs(y))vote(x>0?'ja':'nee');else if(y<0)vote('misschien');else $('undo').click()};$('photo').onpointercancel=()=>{start=null;$('photo').style.transform=''}</script></html>
